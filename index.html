<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HI5 Technet</title>
    <meta name="description" content="HI5 Technet: Adaptive AI Solutions, Enterprise Machine Learning, and AI Process Automation for business transformation.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'primary-brand': '#26d48c',
              'secondary-brand-blue': '#1842b6',
              'background-dark': '#0A192F',
              'text-light': '#E2E8F0',
              'text-muted': '#94A3B8',
              'card-bg': 'rgba(10, 25, 47, 0.7)',
              'glass-border': 'rgba(255, 255, 255, 0.1)',
            },
            fontFamily: {
              sans: ['Sora', 'sans-serif'],
            },
            keyframes: {
                'pulse-light': {
                    '0%, 100%': { boxShadow: '0 0 10px rgba(38, 212, 140, 0.4), 0 0 20px rgba(38, 212, 140, 0.2)' },
                    '50%': { boxShadow: '0 0 20px rgba(38, 212, 140, 0.8), 0 0 40px rgba(38, 212, 140, 0.4)' },
                },
                'gradient-pulse': {
                    '0%, 100%': { backgroundPosition: '0% 50%' },
                    '50%': { backgroundPosition: '100% 50%' },
                },
                'fade-in-up': {
                  '0%': { opacity: '0', transform: 'translateY(20px)' },
                  '100%': { opacity: '1', transform: 'translateY(0)' },
                },
                'marquee': {
                  '0%': { transform: 'translateX(0%)' },
                  '100%': { transform: 'translateX(-100%)' },
                },
                'dot-glow': {
                  '0%, 100%': { filter: 'drop-shadow(0 0 4px rgba(38, 212, 140, 0.6))' },
                  '50%': { filter: 'drop-shadow(0 0 8px rgba(24, 66, 182, 0.8))' },
                }
            },
            animation: {
                'pulse-light': 'pulse-light 2s infinite ease-in-out',
                'gradient-pulse': 'gradient-pulse 4s ease infinite',
                'fade-in-up': 'fade-in-up 0.6s ease-out forwards',
                'marquee': 'marquee 30s linear infinite',
                'dot-glow': 'dot-glow 3s ease-in-out infinite alternate',
            }
          }
        }
      }
    </script>
</head>
<body class="bg-background-dark text-text-light font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
